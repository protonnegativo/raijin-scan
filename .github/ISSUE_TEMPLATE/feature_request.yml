name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Raijin tools return small, deduplicated, ranked JSON for AI agents. Requests that fit that goal are the easiest to accept. Please open the issue before writing code.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should change. If it adds or changes JSON output, show an example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you send a pull request?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
