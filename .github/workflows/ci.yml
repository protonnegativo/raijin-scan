name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: pip install tiktoken
      - name: offline benchmark
        run: |
          PY=python3 bench/run.sh "$RUNNER_TEMP/bench" | tee "$RUNNER_TEMP/bench.log"
          if grep -q 'MISSING' "$RUNNER_TEMP/bench.log" || grep -E 'events, [1-9][0-9]* \(finding' "$RUNNER_TEMP/bench.log"; then
            echo "verify reports missing results"; exit 1
          fi
