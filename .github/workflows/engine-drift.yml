name: engine drift
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      nuclei:
        description: nuclei version to test (latest or vX.Y.Z)
        default: latest
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      WANT: ${{ inputs.nuclei || 'latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install nuclei
        run: |
          mod=$(jq -r .nuclei.go engines.json)
          go install "$mod@$WANT"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: installed versions
        id: ver
        run: |
          v=$(nuclei -version -duc 2>&1 | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's/^v//')
          echo "nuclei $v (tested $(jq -r .nuclei.version engines.json))"
          echo "nuclei=$v" >> "$GITHUB_OUTPUT"
      - name: install templates
        run: git clone --depth 1 https://github.com/projectdiscovery/nuclei-templates "$HOME/nuclei-templates"
      - run: pip install tiktoken
      - name: live benchmark
        run: |
          LIVE=1 RATE=300 PY=python3 TPL="$HOME/nuclei-templates" bench/run.sh "$RUNNER_TEMP/live" | tee "$RUNNER_TEMP/live.log"
          grep -E 'nuclei events|MISSING' "$RUNNER_TEMP/live.log" > "$RUNNER_TEMP/verify.txt" || true
          bad=0
          if grep -q MISSING "$RUNNER_TEMP/verify.txt" || grep -qE 'events, [1-9][0-9]* \(finding' "$RUNNER_TEMP/verify.txt"; then bad=1; fi
          if grep -l '"engine_format"' "$RUNNER_TEMP"/live/*/raijin.json; then
            grep -h -o '"kind":"engine_format"[^}]*' "$RUNNER_TEMP"/live/*/raijin.json >> "$RUNNER_TEMP/verify.txt"; bad=1
          fi
          if ! grep -q 'nuclei events' "$RUNNER_TEMP/verify.txt"; then echo "benchmark did not reach verify" >> "$RUNNER_TEMP/verify.txt"; bad=1; fi
          exit $bad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-bench
          path: ${{ runner.temp }}/live
          retention-days: 14
      - name: commit the bump and release
        id: bump
        if: success()
        run: |
          v="${{ steps.ver.outputs.nuclei }}"
          old=$(jq -r .nuclei.version engines.json)
          newer=$(printf '%s\n%s\n' "$old" "$v" | sort -V | tail -1)
          if [ -z "$v" ] || [ "$v" = "$old" ] || [ "$newer" != "$v" ]; then echo "nothing to bump"; exit 0; fi
          jq --arg v "$v" '.nuclei.version = $v' engines.json > engines.tmp && mv engines.tmp engines.json
          if ! go test ./... > "$RUNNER_TEMP/gotest.log" 2>&1; then
            { echo "go test ./... fails with engines.json at nuclei $v:"; tail -40 "$RUNNER_TEMP/gotest.log"; } >> "$RUNNER_TEMP/verify.txt"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engines.json
          git commit -m "Test with nuclei $v"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          .github/release.sh patch
      - name: close the drift issue
        if: success()
        run: |
          v="${{ steps.ver.outputs.nuclei }}"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for n in $(gh issue list --label engine-drift --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Passes with nuclei $v: $run"
          done
      - name: open or update the drift issue
        if: failure()
        run: |
          v="${{ steps.ver.outputs.nuclei }}"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          { echo "nuclei $v failed the live benchmark."; echo; echo '```'; cat "$RUNNER_TEMP/verify.txt" 2>/dev/null; echo '```'; echo; echo "Run: $run"; } > body.md
          gh label create engine-drift --color B60205 --description "An engine update broke the tool" 2>/dev/null || true
          n=$(gh issue list --label engine-drift --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file body.md
          else
            gh issue create --title "Engine drift: nuclei $v" --label engine-drift --body-file body.md
          fi
