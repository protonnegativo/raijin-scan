name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: skip pushes that do not change the binary
        id: changed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo "release=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BEFORE" HEAD)
          code=$(printf '%s\n' "$files" | grep -vE '^(bench/fixtures/|docs/|\.github/)|\.md$' | grep -v '^$' || true)
          if [ -z "$code" ]; then echo "only docs, fixtures or workflows changed"; echo "release=false" >> "$GITHUB_OUTPUT"; else echo "release=true" >> "$GITHUB_OUTPUT"; fi
      - name: tag and release
        if: github.event_name != 'push' || steps.changed.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/release.sh "${{ inputs.bump || 'patch' }}"
