# tmux layout for the README demo (docs/demo.tape): two panes side by side, a title on top of each, no status
# bar. Prefix + g presses Enter in both panes at once, so both scans start at the same moment.
set -s escape-time 0
set -g status off
set -g pane-border-status top
set -g pane-border-format "#[fg=colour16,bg=colour117,bold]  #{pane_title}  #[default]"
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour240
set -g default-command "bash --norc"
bind g send-keys -t :.0 Enter \; send-keys -t :.1 Enter
